# SACONE master PostgreSQL — single database for ERP
#
# Usage:
#   docker compose up -d
#   npm run db:migrate
#   npm run dev
#
# Connection:
#   postgresql://sacone:sacone@localhost:5432/sacone

services:
  postgres:
    image: postgres:16-alpine
    container_name: sacone-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sacone
      POSTGRES_PASSWORD: sacone
      POSTGRES_DB: sacone
    volumes:
      - sacone_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacone -d sacone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sacone_pg_data:
