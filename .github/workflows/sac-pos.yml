# SAC-POS mobile app: CI on every change, CD (APK build + GitHub release) on main.
#
# CI  — typecheck + unit tests, and a check that the lockfile installs with npm 10.
# CD  — builds the Android APK here on GitHub with Gradle (no Expo account / EAS), signs it with the
#       shop's own release key, then publishes a GitHub release "sac-pos-v<version>-b<build>" with
#       sac-pos.apk + sac-pos.json. Each shop's SACONE server picks the release up within 30
#       minutes and offers it to its paired phones in SAC-POS → More → App update.
#
# Needs three repository secrets (made on the shop PC, see D:\Vyoumix\sacone-signing\README.txt):
#   SACPOS_KEYSTORE_BASE64, SACPOS_KEYSTORE_PASSWORD, SACPOS_KEY_ALIAS
# Skip a release for a commit with "[skip app]" in its message, or run it by hand (Actions → Run workflow).

name: SAC-POS app

on:
  push:
    branches: [main]
    paths:
      - 'sacone/sac-pos/**'
      - '.github/workflows/sac-pos.yml'
  pull_request:
    paths:
      - 'sacone/sac-pos/**'
      - '.github/workflows/sac-pos.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish a new APK
        type: boolean
        default: true

defaults:
  run:
    working-directory: sacone/sac-pos

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sacone/sac-pos/package-lock.json
            sacone/sacone-api/package-lock.json
      - run: npm ci
      # tests/domain.test.ts checks the phone's bill maths against the server's (sacone-api/src/services/pos.js)
      - name: Install server packages for the shared-maths test
        working-directory: sacone/sacone-api
        run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npx vitest run

  release:
    name: Build APK (Gradle) & publish release
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.release) ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip app]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: sac-pos-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SACPOS_KEYSTORE_BASE64: ${{ secrets.SACPOS_KEYSTORE_BASE64 }}
      SACPOS_KEYSTORE_PASSWORD: ${{ secrets.SACPOS_KEYSTORE_PASSWORD }}
      SACPOS_KEY_ALIAS: ${{ secrets.SACPOS_KEY_ALIAS }}
      # build numbers above the old Expo builds, rising with every run
      SACPOS_VERSION_CODE: ${{ github.run_number }}00
    steps:
      - name: Check signing key
        id: key
        # runs before checkout, so not in sacone/sac-pos (the job default)
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$SACPOS_KEYSTORE_BASE64" ] || [ -z "$SACPOS_KEYSTORE_PASSWORD" ] || [ -z "$SACPOS_KEY_ALIAS" ]; then
            echo "::warning::SAC-POS signing secrets are not set; skipping the APK. Add SACPOS_KEYSTORE_BASE64, SACPOS_KEYSTORE_PASSWORD and SACPOS_KEY_ALIAS (Settings → Secrets and variables → Actions)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sacone/sac-pos/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        if: steps.key.outputs.ok == 'true'
        run: npm ci

      - name: Generate the Android project
        if: steps.key.outputs.ok == 'true'
        run: CI=1 npx expo prebuild --platform android --no-install --clean

      - name: Build and sign the APK
        if: steps.key.outputs.ok == 'true'
        run: |
          echo "$SACPOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sac-pos-release.p12"
          export SACPOS_KEYSTORE="$RUNNER_TEMP/sac-pos-release.p12"
          cd android
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../sac-pos.apk
          rm -f "$SACPOS_KEYSTORE"

      - name: Describe the APK
        if: steps.key.outputs.ok == 'true'
        id: meta
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE="$SACPOS_VERSION_CODE"
          SHA=$(sha256sum sac-pos.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s sac-pos.apk)
          git log -1 --pretty=%B | head -c 1500 > notes.txt
          jq -n --arg v "$VERSION" --argjson c "$CODE" --arg sha "$SHA" --argjson size "$SIZE" \
                --rawfile notes notes.txt --arg commit "$GITHUB_SHA" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{versionName:$v, versionCode:$c, sha256:$sha, size:$size, notes:$notes, commit:$commit, publishedAt:$at}' > sac-pos.json
          cat sac-pos.json
          echo "tag=sac-pos-v${VERSION}-b${CODE}" >> "$GITHUB_OUTPUT"
          echo "title=SAC-POS ${VERSION} (build ${CODE})" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" sac-pos.apk sac-pos.json \
            --target "$GITHUB_SHA" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file notes.txt
